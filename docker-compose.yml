services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: santabarbearia
      POSTGRES_PASSWORD: santabarbearia
      POSTGRES_DB: santabarbearia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santabarbearia -d santabarbearia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
